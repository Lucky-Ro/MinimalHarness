[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-agent-harness"
version = "0.1.0"
description = "A multi-session CLI agent with reviewed tool calls and rolling context summaries"
requires-python = ">=3.10"
dependencies = ["openai>=1.30,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
